name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar Node.js para compilar o CSS
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - name: Instalar dependências de compilação
        run: pnpm install --frozen-lockfile
      - name: Gerar CSS estático do Tailwind
        run: pnpm build:css
      - name: Preparar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
