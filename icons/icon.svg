<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Laptop Outline -->
  <rect x="116" y="140" width="280" height="175" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="12" />
  
  <!-- Screen Area -->
  <rect x="136" y="160" width="240" height="135" rx="8" fill="#0f172a" />

  <!-- Laptop Base -->
  <path d="M80 325 L432 325 C445 325 452 334 444 345 L420 375 C414 382 404 385 392 385 L120 385 C108 385 98 382 92 375 L68 345 C60 334 67 325 80 325 Z" fill="#334155" stroke="#64748b" stroke-width="6" />
  <rect x="226" y="328" width="60" height="8" rx="4" fill="#94a3b8" />

  <!-- QR Code / Barcode Inside Screen -->
  <!-- Top Left Target -->
  <rect x="160" y="180" width="36" height="36" rx="4" fill="none" stroke="#38bdf8" stroke-width="6" />
  <rect x="172" y="192" width="12" height="12" fill="#38bdf8" />

  <!-- Top Right Target -->
  <rect x="316" y="180" width="36" height="36" rx="4" fill="none" stroke="#38bdf8" stroke-width="6" />
  <rect x="328" y="192" width="12" height="12" fill="#38bdf8" />

  <!-- Bottom Left Target -->
  <rect x="160" y="240" width="36" height="36" rx="4" fill="none" stroke="#38bdf8" stroke-width="6" />
  <rect x="172" y="252" width="12" height="12" fill="#38bdf8" />

  <!-- Barcode Lines in Center -->
  <rect x="220" y="180" width="6" height="40" fill="#a5b4fc" />
  <rect x="232" y="180" width="12" height="40" fill="#a5b4fc" />
  <rect x="250" y="180" width="6" height="40" fill="#a5b4fc" />
  <rect x="262" y="180" width="16" height="40" fill="#a5b4fc" />
  <rect x="284" y="180" width="8" height="40" fill="#a5b4fc" />

  <!-- Laser Scan Beam -->
  <line x1="130" y1="228" x2="382" y2="228" stroke="url(#laserGrad)" stroke-width="8" stroke-linecap="round" />

  <!-- Badge at bottom right: Checkmark -->
  <circle cx="395" cy="385" r="45" fill="#10b981" stroke="#ffffff" stroke-width="8" />
  <path d="M375 385 L390 400 L418 372" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
</svg>

